<body>
<div id="wrap"><div id="stage">
  <div id="scene"></div>
  <div id="cap"></div>
  <div id="endov"></div>
  <div id="menu"></div>
</div></div>
<div id="hud">
  <span class="pos" id="pos"></span>
  <button id="bMenu" title="목록 (Esc)">☰ 목록</button>
  <button id="bRe" title="처음부터 (R)">⏮</button>
  <button id="bPrev" title="이전 대사 (←)">◀</button>
  <button id="bPlay" title="일시정지/재생 (Space)">⏯</button>
  <button id="bNext" title="다음 대사 (→)">▶</button>
  <button id="bFs" title="전체화면 (F)">⛶</button>
</div>
<script>
/* =========================================================
   리드콤 프로그램 (v1.6, 2024) & 스토커 프로브 기법
   임상 적용 설명 애니메이션
   - 음성: audio/<대사ID>.mp3 (ElevenLabs, 또는 .wav)가 있으면 사용, 없으면 브라우저 한국어 음성(임시)
   - 효과음: Web Audio API로 직접 합성 (오프라인 동작)
   ========================================================= */

const SPK = {
  N:     {name:'내레이션', color:'#1F2A44', pitch:1.0,  rate:1.02},
  mom:   {name:'엄마',     color:'#E0607E', pitch:1.25, rate:1.0},
  hajun: {name:'하준',     color:'#C98A00', pitch:1.9,  rate:1.05},
  th:    {name:'치료사',   color:'#3B6FD8', pitch:0.8,  rate:0.98},
  doyun: {name:'도윤',     color:'#8E5BD8', pitch:1.6,  rate:1.05},
};

const stage = document.getElementById('stage');
const scene = document.getElementById('scene');
const cap = document.getElementById('cap');
const endov = document.getElementById('endov');
const menu = document.getElementById('menu');
let S = {};            // current scene state
let INSTANT = false;   // true while fast-rebuilding
let RUN = null;        // run token
let CUR = {ci:-1, si:0};
let paused = false, playAll = false;
let CURA = null;       // current audio handle

/* ---------- layout scale ---------- */
function fit(){ const s=Math.min(innerWidth/1600, innerHeight/900); stage.style.transform=`scale(${s})`; }
addEventListener('resize', fit); fit();

/* ---------- helpers ---------- */
const $ = s => stage.querySelector(s);
const $$ = s => [...stage.querySelectorAll(s)];
function add(html){ scene.insertAdjacentHTML('beforeend', html); }
function addc(sel, ...c){ const e=$(sel); if(e) e.classList.add(...c); }
function on(sel, v=true){ $$(sel).forEach(e=>e.classList.toggle('on', v)); }
function later(fn, ms){ if(INSTANT) return fn(); const tk=RUN; setTimeout(()=>{ if(RUN===tk) fn(); }, ms); }
function seq(fns, gap){ fns.forEach((f,i)=> later(f, i*gap)); }
function hdr(k,t){ return `<div class="hdr"><div class="kicker en">${k}</div><div class="ttl">${t}</div></div>`; }
function flowCards(c, cards){ return `<div class="ov">${cards.map((x,i)=>`<div class="fc fade" id="fc${i+1}" style="--c:${x.c||c}"><div class="no">${x.no}</div><h4>${x.h}</h4>${x.d}</div>`).join('')}</div>`; }
function ovHL(upto, hl){ for(let i=1;i<=5;i++){ const e=$('#fc'+i); if(!e) continue; if(i<=upto) e.classList.add('on'); e.classList.toggle('hl', [].concat(hl).includes(i)); } sfx('pop'); }
/* ---------- camera zoom (포인트 확대) ---------- */
let CAM={s:1,x:0,y:0};
function camSet(s,x,y){ CAM={s,x,y}; scene.style.transform=(s===1&&!x&&!y)?'':`translate(${x}px,${y}px) scale(${s})`; }
function relBox(e){ let x=0,y=0,n=e; while(n&&n!==scene){ x+=n.offsetLeft; y+=n.offsetTop; n=n.offsetParent; } return n===scene?{x,y,w:e.offsetWidth,h:e.offsetHeight}:null; }
function cam(sels, maxS=1.7){
  if(!sels){ camSet(1,0,0); return; }
  let L=1e9,T=1e9,R=-1e9,B=-1e9;
  [].concat(sels).forEach(sel=>$$(sel).forEach(e=>{ const b=relBox(e); if(!b||!b.w) return; L=Math.min(L,b.x); T=Math.min(T,b.y); R=Math.max(R,b.x+b.w); B=Math.max(B,b.y+b.h); }));
  if(L>R){ camSet(1,0,0); return; }
  const pad=36, VH=715, w=R-L+pad*2, h=B-T+pad*2;
  const s=Math.min(maxS, 1600/w, VH/h);
  if(s<1.08){ camSet(1,0,0); return; }
  let x=800-((L+R)/2)*s, y=VH/2-((T+B)/2)*s;
  x=Math.min(0,Math.max(1600-1600*s,x)); y=Math.min(0,Math.max(900-900*s,y));
  camSet(s,x,y);
}

function tween(from, to, ms, cb, done){
  if(INSTANT){ cb(to); done&&done(); return; }
  const tk=RUN, t0=performance.now();
  (function f(now){ if(RUN!==tk) return; const p=Math.min(1,(now-t0)/ms); cb(from+(to-from)*p); if(p<1) requestAnimationFrame(f); else done&&done(); })(t0);
}

/* ---------- characters (flat SVG) ---------- */
function charSVG(t){
  const P={mom:{shirt:'#F4A7B9',hair:'#4A3428'},th:{shirt:'#4C74D9',hair:'#2E2A28'},hajun:{shirt:'#FFC94A',hair:'#3A2A20'},doyun:{shirt:'#A88BE6',hair:'#2B211B'}}[t];
  const kid = (t==='hajun'||t==='doyun');
  let back='', front='';
  if(t==='mom'){ back=`<path d="M40 96 Q34 210 72 214 L128 214 Q166 210 160 96 Q152 30 100 30 Q48 30 40 96Z" fill="${P.hair}"/>`;
                 front=`<path d="M46 100 Q44 38 100 37 Q156 38 154 100 Q140 64 106 60 Q78 70 46 100Z" fill="${P.hair}"/>`; }
  if(t==='th'){ back=`<path d="M40 100 Q36 32 100 30 Q164 32 160 100 L160 150 Q134 160 130 140 L70 140 Q66 160 40 150Z" fill="${P.hair}"/>`;
                front=`<path d="M46 102 Q44 40 100 38 Q156 40 154 102 Q148 70 112 62 Q88 78 46 102Z" fill="${P.hair}"/>`; }
  if(kid){ front=`<path d="M46 98 Q44 36 100 35 Q156 36 154 98 Q146 66 128 60 Q120 74 100 64 Q86 76 70 62 Q54 70 46 98Z" fill="${P.hair}"/>`; }
  const glasses = t==='th' ? `<g stroke="#2B2B2B" stroke-width="3" fill="rgba(255,255,255,.25)"><circle cx="80" cy="100" r="14"/><circle cx="120" cy="100" r="14"/><line x1="94" y1="100" x2="106" y2="100"/></g>` : '';
  const lany = t==='th' ? `<path d="M82 172 L100 222 L118 172" stroke="#fff" stroke-width="4" fill="none"/><rect x="87" y="220" width="26" height="32" rx="4" fill="#fff" stroke="#D5DCE8" stroke-width="2"/><rect x="92" y="228" width="16" height="4" rx="2" fill="#4C74D9"/>` : '';
  const blush = t!=='th' ? `<circle cx="68" cy="120" r="9" fill="#F49A9A" opacity=".45"/><circle cx="132" cy="120" r="9" fill="#F49A9A" opacity=".45"/>` : '';
  return `<svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">${back}
    <path d="M22 300 L22 238 Q24 172 100 168 Q176 172 178 238 L178 300Z" fill="${P.shirt}"/>
    <rect x="88" y="138" width="24" height="36" rx="8" fill="#EFC3A4"/>
    <circle cx="100" cy="96" r="54" fill="#F7D5BC"/>
    ${front}
    <circle cx="80" cy="101" r="5.5" fill="#2B2B2B"/><circle cx="120" cy="101" r="5.5" fill="#2B2B2B"/>
    ${glasses}${blush}
    <path class="smile" d="M88 124 Q100 134 112 124" stroke="#9C4A46" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path class="frown" d="M88 132 Q100 122 112 132" stroke="#9C4A46" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse class="mouth" cx="100" cy="127" rx="9" ry="6" fill="#9C4A46"/>
    ${lany}</svg>`;
}
function placeChar(type, x, top, h, cls, label, bounds){
  const w=h*2/3;
  add(`<div class="ch ${cls}" style="left:${x}px;top:${top}px;width:${w}px;height:${h}px">${charSVG(type)}${label?`<span class="lbl">${label}</span>`:''}</div>`);
  return {x, y: top + h*0.12, sel:'.'+cls, min:bounds?.[0], max:bounds?.[1]};
}

/* ---------- sound effects (Web Audio) ---------- */
let AC=null, MASTER=null;
function ac(){ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); MASTER=AC.createGain(); MASTER.gain.value=0.9; MASTER.connect(AC.destination);} if(AC.state==='suspended') AC.resume(); return AC; }
function tone(f,t0,dur,type='sine',vol=.2,f2){
  const c=ac(), o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t0); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g).connect(MASTER); o.start(t0); o.stop(t0+dur+0.05);
}
function noise(t0,dur,f1,f2,vol=.25){
  const c=ac(), n=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const src=c.createBufferSource(); src.buffer=buf;
  const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.2; bp.frequency.setValueAtTime(f1,t0); bp.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  const g=c.createGain(); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+dur*0.4); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(bp).connect(g).connect(MASTER); src.start(t0); src.stop(t0+dur+0.02);
}
const SFX = {
  ding(){ const t=ac().currentTime; tone(1046.5,t,.7,'sine',.22); tone(1568,t+.07,.8,'sine',.14); tone(2093,t+.07,.5,'sine',.04); },
  tok(){ const t=ac().currentTime; tone(587,t,.16,'triangle',.16); tone(440,t+.09,.22,'triangle',.11); },
  whoosh(){ noise(ac().currentTime,.45,350,2600,.22); },
  pop(){ const t=ac().currentTime; tone(520,t,.12,'sine',.16,1040); },
  ng(){ const t=ac().currentTime; tone(330,t,.11,'square',.07); tone(262,t+.15,.2,'square',.07); },
  ok(){ const t=ac().currentTime; tone(784,t,.3,'sine',.2); tone(1046.5,t+.16,.55,'sine',.2); },
  levelup(){ const t=ac().currentTime; [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,t+i*.09,.32,'triangle',.14)); tone(1568,t+.38,.8,'sine',.13); tone(2093,t+.38,.6,'sine',.05); },
  check(){ const t=ac().currentTime; tone(880,t,.12,'sine',.14); tone(1318.5,t+.07,.2,'sine',.11); },
  tick(){ const t=ac().currentTime; tone(1600,t,.04,'square',.035); },
  stop(){ const t=ac().currentTime; tone(392,t,.22,'triangle',.16,330); },
};
function sfx(name){ if(INSTANT||!name||name==='none') return; try{ SFX[name]&&SFX[name](); }catch(e){} }

/* ---------- voice ---------- */
let KO=null;
function pickVoice(){ const v=speechSynthesis.getVoices().filter(x=>x.lang&&x.lang.toLowerCase().startsWith('ko')); KO=v.find(x=>/natural|online/i.test(x.name))||v[0]||null; }
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function plain(t){ return t.replace(/<[^>]+>/g,''); }
function setTalk(step, v){
  [].concat(step.at||step.s).forEach(k=>{ const a=S.anchors?.[k]; if(a&&a.sel) $$(a.sel).forEach(e=>e.classList.toggle('talk',v)); });
}
function stopAudio(){
  if(CURA){ if(CURA.a){ CURA.a.onended=null; CURA.a.onerror=null; try{CURA.a.pause();}catch(e){} } }
  CURA=null; if(window.speechSynthesis) speechSynthesis.cancel();
  $$('.ch.talk').forEach(e=>e.classList.remove('talk'));
}
function speak(step){
  return new Promise(resolve=>{
    let fin=false; const done=()=>{ if(fin) return; fin=true; setTalk(step,false); resolve(); };
    setTalk(step,true);
    const exts=['wav','mp3']; let k=0;
    const tts=()=>{
      const txt=step.say||plain(step.t);
      const est=Math.max(2500, txt.length*190)+4000;
      if(!window.speechSynthesis){ setTimeout(done, est-4000); return; }
      const u=new SpeechSynthesisUtterance(txt); u.lang='ko-KR'; if(KO) u.voice=KO;
      const sp=SPK[step.s]; u.pitch=sp.pitch; u.rate=sp.rate;
      // if the voice engine ends abnormally fast (muted/unsupported), keep a natural reading pace
      const t0=performance.now(), minD=txt.length*140+500;
      const fin2=()=>{ const el=performance.now()-t0; if(el<minD*0.5) setTimeout(done, minD-el); else done(); };
      u.onend=fin2; u.onerror=fin2; CURA={tts:true, done};
      speechSynthesis.cancel(); speechSynthesis.speak(u);
      setTimeout(done, est);
    };
    const tryA=()=>{
      if(k>=exts.length) return tts();
      const a=new Audio(`audio/${step.id}.${exts[k++]}`);
      CURA={a, done};
      a.onended=done; a.onerror=()=>{ if(!fin) tryA(); };
      a.play().catch(()=>{});
    };
    tryA();
  });
}

/* ---------- bubbles & caption ---------- */
function clearBubbles(){ $$('.bub').forEach(b=>b.remove()); }
function bubble(step){
  const sp=SPK[step.s];
  [].concat(step.at||step.s).forEach(key=>{
    const a=S.anchors?.[key]; if(!a) return;
    const b=document.createElement('div'); b.className='bub';
    b.style.setProperty('--c', sp.color);
    const mn=a.min??24, mx=a.max??1576;
    b.style.maxWidth=Math.min(S.bubMax||520, mx-mn)+'px';
    if(S.bubFont) b.style.fontSize=S.bubFont+'px';
    b.innerHTML=`<span class="who">${sp.name}</span>${step.t}`+(step.tag?`<span class="tag ${step.tag.k}">${step.tag.t}</span>`:'');
    b.style.visibility='hidden'; scene.appendChild(b);
    const w=b.offsetWidth, h=b.offsetHeight;
    const left=Math.max(mn, Math.min(a.x-w/2, mx-w));
    b.style.left=left+'px'; b.style.top=(a.y-h-20)+'px';
    b.style.setProperty('--tx', Math.max(32, Math.min(w-32, a.x-left))+'px');

function caption(step){
  if(step.s==='N'){ cap.innerHTML=`<span class="n">내레이션</span>${step.t}`; cap.classList.add('on'); }

/* ---------- engine ---------- */
function applyStart(step){
  if(step.id){ if(!step.keep) clearBubbles(); }
  else if(step.clear){ clearBubbles(); cap.classList.remove('on'); }
  step.do && step.do(S);
  if(step.zoom!==undefined){ const z=step.zoom; later(()=>cam(z, step.zmax||1.7), 280); }
  if(step.id){
    caption(step);
    if(step.s!=='N') bubble(step);
    if(step.tag){ S.onTag && S.onTag(step.tag.k); }
    sfx(step.sfx!==undefined ? step.sfx : (step.tag ? ({g:'ding',o:'tok',b:'pop'})[step.tag.k] : (step.s!=='N'?null:null)));
  }
}
function sleep(ms, tk){
  return new Promise(res=>{ let left=ms; const it=setInterval(()=>{ if(RUN!==tk){clearInterval(it);res();return;} if(!paused) left-=50; if(left<=0){clearInterval(it);res();} },50); });
}
async function waitPause(tk){ while(paused && RUN===tk) await sleep(100, tk); }
function build(ci){
  stopAudio(); clearBubbles(); cap.classList.remove('on'); endov.classList.remove('on');
  scene.innerHTML=''; camSet(1,0,0); S={anchors:{}};
  CLIPS[ci].build(S);
}
async function playClip(ci, start=0){
  const tk={}; RUN=tk; paused=false; menu.classList.remove('on');
  const clip=CLIPS[ci];
  stage.classList.add('instant'); INSTANT=true;
  build(ci);
  for(let i=0;i<start;i++){ const st=clip.steps[i]; applyStart(st); st.after && st.after(S); }
  INSTANT=false;
  requestAnimationFrame(()=>requestAnimationFrame(()=>stage.classList.remove('instant')));
  if(start>0) clearBubbles();
  for(let i=start;i<clip.steps.length;i++){
    if(RUN!==tk) return;
    CUR={ci, si:i}; updPos();
    await waitPause(tk); if(RUN!==tk) return;
    const st=clip.steps[i];
    applyStart(st);
    if(st.id){ await sleep(st.s==='N'?150:280, tk); if(RUN!==tk) return; await speak(st); }
    else { let w=st.wait||600; if(playAll && ci<CLIPS.length-1 && i===clip.steps.length-1) w=Math.min(w,150); if(playAll && ci>0 && i===0) w=Math.min(w,250); await sleep(w, tk); }
    if(RUN!==tk) return;
    st.after && st.after(S);
    await sleep(st.gap ?? (st.id?520:0), tk);
  }
  if(RUN!==tk) return;
  CUR={ci, si:clip.steps.length}; updPos();
  if(playAll && ci<CLIPS.length-1){ await sleep(200, tk); if(RUN===tk) playClip(ci+1); return; }
  showEnd(ci);
}
function showEnd(ci){
  endov.innerHTML = (ci<CLIPS.length-1?`<button id="eNext">다음: ${CLIPS[ci+1].short} ▶</button>`:'')+`<button class="ghost" id="eRe">다시 보기</button><button class="ghost" id="eMenu">목록</button>`;
  endov.classList.add('on');
  const n=document.getElementById('eNext'); if(n) n.onclick=()=>playClip(ci+1);
  document.getElementById('eRe').onclick=()=>playClip(ci);
  document.getElementById('eMenu').onclick=showMenu;
}
function updPos(){ const c=CLIPS[CUR.ci]; document.getElementById('pos').textContent = c ? `${c.short} · ${Math.min(CUR.si+1,c.steps.length)}/${c.steps.length}` : ''; }
function togglePause(){

      <div class="src fade" id="gsrc" style="top:648px">출처: 교재 12장 「학령 전 후기 아동의 말더듬 치료: 초기 말더듬」 pp.333–336 (Gottwald, 2010 외)</div>`);
  },
  steps:[
    {wait:700, do(){ on('#gsrc'); }},
    {id:'G-01', zoom:null, s:'N', t:'이번에는 리드콤 프로그램과 비교되는 접근으로, Sheryl Gottwald의 다차원적 접근을 살펴보겠습니다.', do(){ on('#gtop'); sfx('whoosh'); }},
    {id:'G-02', zoom:"#fc1", s:'N', t:'Gottwald는 요구와 용량 모델에 기초합니다. 말더듬을 아동의 능력과 아동에게 주어지는 요구가 상호작용한 결과로 봅니다.', do(){ ovHL(1,1); }},
    {id:'G-03', zoom:["#fc2","#gp1"], s:'N', t:'리드콤 프로그램이 아동에게 초점을 둔다면, Gottwald는 아동과 환경을 함께 치료합니다. 먼저 부모 상담과 가족 모임에서 말더듬에 대해 개방적으로 이야기합니다.', do(){ ovHL(2,2); on('#gp1'); }},
    {id:'G-04', zoom:["#fc3","#gp2"], s:'N', t:'가족은 말속도를 아동에게 맞추고, 대화 사이에 쉬며, 길고 복잡한 대답을 요구하는 질문을 줄입니다. 아동이 더듬었는지보다 아동이 전하는 내용에 반응합니다.', do(){ ovHL(3,3); on('#gp2'); }},
    {id:'G-05', zoom:"#fc4", s:'N', t:'아동에게는 부담이 적은 놀이에서 천천히 편안하게 말하도록 돕고, 쉬운 바운스로 가볍게 더듬는 법을 가르칩니다. 투쟁이 심한 아동은 말더듬을 알아차리고 받아들이는 것부터 시작합니다.', do(){ ovHL(4,4); }},
    {id:'G-06', zoom:"#fc5", s:'N', t:'환경의 스트레스가 줄고, 말더듬이 정상적인 비유창 수준으로 줄면 치료를 마칩니다.', do(){ ovHL(5,5); }},
    {id:'G-07', zoom:null, s:'N', t:'이어서 질문의 요구 수준을 조절하는 스토커 프로브 기법을 살펴보겠습니다.', do(){ ovHL(5,[]); }},
    {wait:1200},
  ]},

/* ---------------- SP. 스토커 프로브 기법 개요 ---------------- */
{ code:'스토커 · 개요', short:'스토커 개요', title:'스토커 프로브 기법 한눈에 보기', desc:'요구 수준 · 측정 · 전이 과정 · 1분',
  build(S){
    add(hdr('스토커 프로브 기법 · 개요','스토커 프로브 기법은 어떻게 진행될까? <span style="font-size:24px;color:#7A869A;font-weight:700">전진호 (2001) 적용 절차</span>'));
    add(`<div class="chip ovtop fade" id="ovtop">실시: 치료사 · 선행사건(질문) 조절</div>`);
    add(flowCards('#3B6FD8',[
      {no:'①', h:'사전 평가', d:'요구 수준 1~5 질문으로<br>비유창이 나타나는 수준 확인'},
      {no:'②', h:'시작 수준 결정', d:'비유창이 나타난 수준보다<br><b>한 단계 아래</b>에서 시작'},
      {no:'③', h:'기초선 측정', d:'같은 수준에서 <b>3회</b> 측정한<br>유창한 구어 시간의 평균'},
      {no:'④', h:'치료 회기', d:'주 3회 · 30분<br>비유창 직전까지 시간 측정<br><b style="color:#E5822A">가장 긴 시간 기록</b>'},
      {no:'⑤', h:'다음 수준으로', d:'가장 긴 시간이 <b>180초</b> 이상이면 전이<br>수준 5까지 단계적 진행', c:'#1F9D63'},
    ]));
    add(`<div class="ovb fade" id="ovb"><div class="lvrow">${[['1','양자택일','딱딱하니, 부드럽니?'],['2','의문사','이건 무엇이니?'],['3','전치사구','어디에 보관하니?'],['4','특성 설명','알고 있는 걸 전부 말해볼래?'],['5','자기 이야기','너의 이야기를 말해볼래?']].map(([n,a,q])=>`<div class="lv"><b>${n} · ${a}</b>“${q}”</div>`).join('')}</div>
      <div class="swrule">⏱ 대답 시작 ~ <b>비유창 직전</b>까지 잽니다.<br>그중 <b>가장 긴 시간</b>을 기록합니다.</div></div>
      <div class="src fade" id="src">요구 수준 원리: Stocker &amp; Usprich (1976) · 측정·전이 기준: 전진호 (2001) 적용 연구</div>`);
  },
  steps:[
    {wait:700, do(){ on('#src'); }},
    {id:'SP-01', zoom:null, s:'N', t:'스토커 프로브 기법은 질문의 요구 수준을 조절해, 아동이 유창하게 말할 수 있는 수준부터 시작하는 방법입니다. 국내 연구인 전진호(2001)의 절차를 중심으로 살펴보겠습니다.', say:'스토커 프로브 기법은 질문의 요구 수준을 조절해, 아동이 유창하게 말할 수 있는 수준부터 시작하는 방법입니다. 국내 연구인 전진호, 2001년 연구의 절차를 중심으로 살펴보겠습니다.', do(){ on('#ovtop'); sfx('whoosh'); }},
    {id:'SP-02', zoom:"#ovb", s:'N', t:'요구 수준은 다섯 단계입니다. 양자택일 질문에서 시작해, 자기 이야기를 지어내는 수준까지 올라갑니다.', do(){ on('#ovb'); sfx('pop'); }},
    {id:'SP-03', zoom:["#fc1","#fc2"], s:'N', t:'먼저 사전 평가로 비유창이 나타나는 수준을 찾고, 그보다 한 단계 아래에서 치료를 시작합니다.', do(){ ovHL(2,[1,2]); }},
    {id:'SP-04', zoom:["#fc3","#fc4"], s:'N', t:'같은 수준에서 세 번 측정한 평균을 기초선으로 삼습니다. 회기에서는 대답을 시작한 때부터 비유창이 나타나기 직전까지의 시간을 재고, 그중 가장 긴 시간을 기록합니다.', do(){ ovHL(4,[3,4]); }},
    {id:'SP-05', zoom:"#fc5", s:'N', t:'유창한 구어 시간이 180초를 넘으면 다음 수준으로 올라가, 수준 5까지 진행합니다.', do(){ ovHL(5,5); }},
    {id:'SP-06', zoom:null, s:'N', t:'먼저 공 하나로 요구 수준 다섯 단계를 예시로 살펴보겠습니다.', do(){ ovHL(5,[]); }},
    {wait:1200},
  ]},

/* ---------------- S1. 요구 수준 계단 ---------------- */
{ code:'스토커 · S1', short:'S1 요구 수준 계단', title:'요구 수준 5단계', desc:'공 하나로 보는 질문 위계 · 1분',
  build(S){
    add(hdr('스토커 프로브 기법','요구 수준 5단계'));
    add(`<div class="floor" style="top:780px"></div>
      <div class="gauge"><div class="gl"><span>요구 수준</span><span>창의성 요구 ↑ · 말더듬 위험 ↑</span></div><div class="gb"><i id="gfill"></i></div></div>
      ${['양자택일','의문사','전치사구','특성 설명','자기 이야기'].map((d,i)=>`<div class="st" id="st${i+1}" style="left:${420+i*134}px;top:${780-60*(i+1)}px;height:${60*(i+1)}px"><b>${i+1}</b><span>${d}</span></div>`).join('')}
      <div class="ball" style="left:322px;top:700px"></div>`);
    S.anchors.th = placeChar('th', 205, 430, 350, 'ch-th', '치료사', [24,800]);
    S.anchors.doyun = placeChar('doyun', 1400, 470, 310, 'ch-doyun', '도윤 (7세)', [1100,1576]);
    S.lv=n=>{ for(let i=1;i<=5;i++){ const e=$('#st'+i); e.classList.toggle('on', i===n); e.classList.toggle('past', i<n); } $('#gfill').style.width=(n*20)+'%'; sfx('levelup'); };
  },
  steps:[
    {wait:800},
    {id:'S1-01', s:'N', t:'스토커 프로브 테크닉은 같은 물건에 대해, 요구 수준이 다른 다섯 가지 질문을 사용합니다.'},
    {id:'S1-02', s:'th', t:'이 공은 딱딱하니, 부드럽니?', do(S){ S.lv(1); }},
    {id:'S1-03', s:'doyun', t:'딱딱해요.', keep:true},
    {id:'S1-04', s:'th', t:'이건 무엇이니?', do(S){ S.lv(2); }},
    {id:'S1-05', s:'doyun', t:'공이요.', keep:true},
    {id:'S1-06', s:'th', t:'이건 어디에 보관하니?', do(S){ S.lv(3); }},
    {id:'S1-07', s:'doyun', t:'서랍 속에요.', keep:true},
    {id:'S1-08', s:'th', t:'이걸로 뭘 하는지, 알고 있는 걸 전부 말해볼래?', do(S){ S.lv(4); }},
    {id:'S1-09', s:'doyun', t:'공은 빨갛고, 둥글고, 잘 튀어 올라요.', keep:true},
    {id:'S1-10', s:'th', t:'이 공에 관한 너의 이야기를 말해볼래?', do(S){ S.lv(5); }},
    {id:'S1-11', s:'doyun', t:'아빠가 어린이날에 공을 사 주셨어요.', keep:true},
    {id:'S1-12', s:'N', t:'질문 안에 답이 있는 수준 1부터, 자기 이야기를 지어내야 하는 수준 5까지. 요구 수준이 올라갈수록 말더듬 가능성도 높아집니다.', clear:true, do(){ clearBubbles(); }},
    {wait:1500},
  ]},

/* ---------------- S2. 스토커 치료 회기 ---------------- */
{ code:'스토커 · S2', short:'S2 스토커 회기', title:'치료 회기와 전이 준거', desc:'유창한 구어 시간 180초 · 1분 30초',
  build(S){
    add(hdr('스토커 프로브 기법','치료 회기 <span style="font-size:28px;color:#7A869A;font-weight:700">주 3회 · 30분</span>'));
    add(`<div class="track" id="trk">${['1','2','3','4','5'].map((r,i)=>`<div id="tk${i+1}"><span>수준 ${r}</span></div>`).join('')}</div>
      <div class="floor" style="top:780px"></div>
      <div class="pre fade" id="pre">사전 평가: <b>수준 3</b>에서 비유창 출현<br>→ 한 단계 아래인 <em>수준 2</em>에서 치료 시작</div>
      <div class="ff" id="ff">⏩ 회기 진행 중…</div>
      <div class="swp" id="swp">⏹ 비유창 → 이번 측정 끝 (9초 기록)</div>
      <div class="src fade" id="src2" style="left:64px;right:auto;top:205px">예시 수치: 전진호 (2001) 대상 A · 수준 II</div>
      <div class="sw fade" id="sw"><svg viewBox="0 0 400 400" width="400" height="400">
        <circle cx="200" cy="200" r="170" fill="#fff" stroke="#E6ECF7" stroke-width="24"/>
        <circle class="ring" id="ring" cx="200" cy="200" r="170" fill="none" stroke="#3B6FD8" stroke-width="24" stroke-linecap="round" stroke-dasharray="1068" stroke-dashoffset="1068" transform="rotate(-90 200 200)"/>
        <g id="bl" opacity="0"><line x1="200" y1="18" x2="200" y2="62" stroke="#E5822A" stroke-width="6" transform="rotate(${24/180*360} 200 200)"/></g>
        </svg><div class="num"><b id="sec">0</b><span>초</span><small>목표 180초</small></div></div>
      <div class="swl fade" id="swl">기초선 산출: 같은 수준에서 3회 측정한 유창한 구어 시간의 평균<br><span style="font-size:17px;font-weight:600;color:#7A869A">유창한 구어 시간 = 대답 시작부터 비유창 직전까지 · 그중 가장 긴 시간</span><br><span id="bltxt" style="color:#E5822A;opacity:0;transition:opacity .4s">◆ 예시 기초선 24초</span> <span style="font-size:17px;font-weight:800;color:#1F9D63">· 기초선 초과 → 사회적 강화 · 180초 이상 → 다음 수준</span></div>
      <div class="obj" id="obj" style="left:300px;top:610px"></div>
      <div class="rec" id="rec"><div class="a">오늘 가장 긴 유창한 구어 시간</div><div class="b">191초</div><div class="c">수준 2 통과 → 수준 3</div></div>`);
    S.anchors.th = placeChar('th', 200, 440, 340, 'ch-th', '치료사', [24,590]);
    S.anchors.doyun = placeChar('doyun', 1400, 480, 300, 'ch-doyun', '도윤', [1010,1576]);
    S.v=0;
    S.set=v=>{ S.v=v; $('#sec').textContent=Math.round(v); $('#ring').style.strokeDashoffset=1068*(1-Math.min(v,180)/180); };
    S.run=(to,ms,done)=>tween(S.v,to,ms,S.set,done);
    S.trk=(n,unlock)=>{ for(let i=1;i<=5;i++){ const e=$('#tk'+i); e.classList.toggle('on',i===n); e.classList.toggle('done',i<n); if(unlock&&i===n){ e.classList.remove('unlock'); void e.offsetWidth; e.classList.add('unlock'); } } };
  },
  steps:[
    {wait:800, do(S){ S.trk(0); on('#src2'); }},
    {id:'S2-01', s:'N', t:'사전 평가에서 도윤이는 수준 3에서 비유창이 나타났습니다. 그래서 한 단계 아래인 수준 2에서 시작합니다.',
      do(S){ on('#pre'); sfx('pop'); later(()=>{ S.trk(2); sfx('ding'); }, 1600); }},
    {id:'S2-02', zoom:["#sw","#swl"], zmax:1.35, s:'N', t:'같은 수준에서 세 번 측정한 평균, 24초가 기초선입니다.',
      do(){ on('#pre',false); later(()=>{ on('#sw'); on('#swl'); sfx('whoosh'); },300); later(()=>{ $('#bl').setAttribute('opacity','1'); $('#bltxt').style.opacity=1; sfx('pop'); },1100); }},
    {id:'S2-03', zoom:null, s:'th', t:'이건 무엇이니?', do(){ $('#obj').textContent='⌚'; sfx('pop'); }},
    {id:'S2-04', s:'doyun', t:'시계요.', do(S){ S.run(9,1300); }},
    {id:'S2-05', s:'th', t:'이건 무엇이니?', do(){ $('#obj').textContent='✏️'; sfx('pop'); }},
    {id:'S2-06', s:'doyun', t:'연-연-연필이요.', say:'연, 연, 연필이요.', sfx:'stop', do(){ $('#sw').classList.add('stop'); on('#swp'); }},
    {id:'S2-06a', s:'N', t:'비유창이 나타나면 그 측정은 여기서 끝납니다. 다음 대답부터 새로 재고, 회기에서 가장 길게 유창했던 시간을 기록합니다.', keep:true},
    {id:'S2-07', s:'th', t:'"연필", 다시 말해볼까?', tag:{t:'실패 시: 더듬은 단어 반복 (BI 123)', k:'o'}},
    {id:'S2-08', s:'doyun', t:'연필.', do(S){ $('#sw').classList.remove('stop'); on('#swp',false); S.set(0); later(()=>{ $('#ff').textContent='⏩ 새 측정 · 이어지는 질문과 대답…'; on('#ff'); S.run(28,1800,()=>on('#ff',false)); },400); }},
    {id:'S2-09', s:'th', t:'좋아, 잘 말했다!', tag:{t:'사회적 강화 · 기초선(24초) 초과', k:'g'}},
    {id:'S2-10', s:'N', t:'유창한 구어 시간이 180초를 넘으면, 다음 수준으로 넘어갑니다.', clear:true,
      do(S){ clearBubbles(); $('#ff').textContent='⏩ 회기를 거듭하며… (4회기)'; on('#ff'); $('#obj').textContent=''; S.set(0);
        S.run(180, 3200, ()=>{ on('#ff',false); sfx('levelup'); S.trk(3,true); S.run(191,500); }); }},
    {id:'S2-11', s:'th', t:'도윤아, 오늘은 191초 동안 부드럽게 말했어!', sfx:'ding', do(){ on('#rec'); }},
    {id:'S2-12', s:'N', t:'매 회기 측정한 시간을 아동에게 보여주어, 스스로 피드백을 받게 합니다.', clear:true, do(){ clearBubbles(); }},
    {wait:1500},
  ]},

/* ---------------- END. 세 접근 비교와 마무리 ---------------- */
{ code:'정리', short:'정리 · 세 접근 비교', title:'세 접근 비교와 마무리', desc:'리드콤 · Gottwald · 스토커 프로브 · 1분 40초',
